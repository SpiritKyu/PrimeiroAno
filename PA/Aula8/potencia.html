 <script>
    var base = parseInt(prompt("Digita a base"));
    var expoente = parseInt(prompt("Digite o expoente"));

    var resultado = 1;
    var i = 1;

    do{
        resultado = resultado * base;
        i++;
    }while(i<=expoente);

    document.write("O resultado da potencia eh: " + resultado);
</script>

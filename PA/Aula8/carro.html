<script>
    var ultimoD = parseInt(prompt("Entre com o ultimo numero da placa do veiculo"));

    switch(ultimoD){
        case 1,2:
            document.write("Não circule na Segunda-feira");

        break;

        case 3,4: 
            document.write("Não circule na Terca-feira");
        
        break;

        case 5,6:
            document.write("Não circule na Quarta-feira");

        break;

        case 7,8:
            document.write("Não circule na Quinta-feira");
        break;

        case 9,0:
            document.write("Não circule na Sexta-feira")

        break;
        
        default:
            document.write("Placa invalida")
    };
</script>

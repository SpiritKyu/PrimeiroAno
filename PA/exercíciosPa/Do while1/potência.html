<script>

let i = 1;
let potencia = 1;
let base = parseInt(prompt("Entre com a base:"));
let expoente = parseInt(prompt("Entre com o expoente:"));

do {

    potencia = potencia * base;

    i = i + 1;

} while (i <= expoente);
i++
document.write("Potencia: " + potencia + "<br>");



</script>

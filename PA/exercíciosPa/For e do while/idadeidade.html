<script>


let maisVelho = -9999;
let maisNovo = 9999;

for (let i = 1; i <= 6; i++) {
    let anoAtual = parseInt(prompt("Digite o ano atual:"));
    let anoNasc = parseInt(prompt("Digite o ano de nascimento:"));
    let idade = anoAtual - anoNasc;

    if (idade > maisVelho) {
        maisVelho = idade;
    }
    if (idade < maisNovo) {
        maisNovo = idade;
    }
}

document.write("Maior idade: " + maisVelho + "<br>");
document.write("Menor idade: " + maisNovo + "<br>");



</script>

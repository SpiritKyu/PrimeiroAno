<script>
var vetor1 = [];

var vetor2 = [];

var vetor3 = [];

var i;

for (i = 0; i < 5; i++) {
    vetor1[i] = parseInt(prompt("primeiro numero:"));
}

for (i = 0; i < 5; i++) {
    vetor2[i] = parseInt(prompt("segundo numero:"));
}

for (i = 0; i < 5; i++) {
    vetor3[i] = vetor1[i] + vetor2[i];
}

document.write("Vetor 1: " + vetor1 + "<br>");

document.write("Vetor 2: " + vetor2 + "<br>");

document.write("Soma: " + vetor3);
</script>

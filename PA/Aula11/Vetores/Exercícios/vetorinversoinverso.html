<script>

var vetor = [];

var i;

var positivos = 0;

var negativos = 0;

var zeros = 0;


for (i = 0; i < 10; i++) {
    vetor[i] = Number(prompt("Entre um número inteiro:"));

    if (vetor[i] > 0) {
        positivos++;
    } else if (vetor[i] < 0) {
        negativos++;
    } else {
        zeros++;
    }
}

document.write("Vetor: " + vetor + "<br>");

document.write("Número de positivos: " + positivos + "<br>");

document.write("Número de negativos: " + negativos + "<br>");

document.write("Número de zeros: " + zeros);

</script>

<script>
    var idade=parseFloat(prompt("Entre com a idade do aluno."));
    switch(idade){
        case 6:  
            document.write("dente de leite")
            break

        case 7:
            document.write("júnior")
            break

        case 8:
            document.write("júnior max")
            break

        case 9:
            document.write("júnior master")
            break

        case 10:
            document.write("master")
            break
            
        
        default:
            document.write("Idade inválida.")
    }
</script>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/arg.css">

<body>
    <main class="riddle-shell" data-riddle="7">
        <div class="riddle-topline"><span>ARQUIVO 07 / 13</span><span>ACESSO RESTRITO</span></div>
        <section class="riddle-content">
            <p class="riddle-prompt">A fala “Eu não fui, hein!” sugere principalmente que Cascão:</p>
            <form class="answer-form">
                <div class="choice-list">
                    <label class="choice-option"><input type="radio" name="answer" value="a">A) Está preocupado com a reciclagem.</label>
                    <label class="choice-option"><input type="radio" name="answer" value="b">B) Recusa participar da conversa.</label>
                    <label class="choice-option"><input type="radio" name="answer" value="c">C) Desvia a responsabilidade coletiva para a culpa individual.</label>
                    <label class="choice-option"><input type="radio" name="answer" value="d">D) Denuncia um culpado específico pelo lixo.</label>
                </div>
                <div class="answer-row"><button class="choice-submit" type="submit">Enviar ↗</button></div>
                <p class="feedback" aria-live="polite"></p>
            </form>
        </section>
    </main>

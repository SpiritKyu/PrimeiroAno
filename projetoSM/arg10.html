<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080809">
    <title>ARG 10 | Questão 5</title>
    <link rel="stylesheet" href="css/arg.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <main class="riddle-shell" data-riddle="10">
        <div class="riddle-topline"><span>ARQUIVO 10 / 13</span><span>ACESSO RESTRITO</span></div>
        <section class="riddle-content">
            <p class="riddle-prompt">A história evita defender que a tecnologia resolve tudo porque:</p>
            <form class="answer-form">
                <div class="choice-list">
                    <label class="choice-option"><input type="radio" name="answer" value="a">A) Franjinha abandona o aplicativo.</label>
                    <label class="choice-option"><input type="radio" name="answer" value="b">B) Os personagens reconhecem que aparelhos velhos viram lixo eletrônico.</label>
                    <label class="choice-option"><input type="radio" name="answer" value="c">C) Mônica proíbe o uso de celulares.</label>
                    <label class="choice-option"><input type="radio" name="answer" value="d">D) Cascão recusa qualquer tipo de tecnologia.</label>
                </div>
                <div class="answer-row"><button class="choice-submit" type="submit">Enviar ↗</button></div>
                <p class="feedback" aria-live="polite"></p>
            </form>
        </section>
    </main>
</body>
</html>

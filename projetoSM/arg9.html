<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080809">
    <title>ARG 09</title>
    <link rel="stylesheet" href="css/arg.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <main class="riddle-shell" data-riddle="3">
        <div class="riddle-topline"><span>ARQUIVO 09 / 13</span><span>ACESSO RESTRITO</span></div>
        <section class="riddle-content">
            <p class="riddle-prompt">Sou a porta de entrada da internet. Tenho botões, menus, cores e imagens. Não sou o que está por trás do código, mas sou a parte bonita e fácil que você clica e vê na tela. Quem sou eu?</p>
            <form class="answer-form">
                <div class="answer-row"><input id="answer" name="answer" type="text" autocomplete="off" spellcheck="false" required><button type="submit">Enviar ↗</button></div>
                <p class="feedback" aria-live="polite"></p>
            </form>
            <p class="input-instruction">Digite minusculo e sem acento</p>
        </section>
    </main>
</body>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ARG 09 | Questão 4</title>
    <link rel="stylesheet" href="css/arg.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <main class="riddle-shell" data-riddle="9">
        <div class="riddle-topline"><span>ARQUIVO 09 / 13</span><span>ACESSO RESTRITO</span></div>
        <section class="riddle-content">
            <p class="riddle-prompt">Uma lacuna da história é que:</p>
            <form class="answer-form">
                <div class="choice-list">
                    <label class="choice-option"><input type="radio" name="answer" value="a">A) Não há personagens crianças.</label>
                    <label class="choice-option"><input type="radio" name="answer" value="b">B) O aplicativo não aparece sendo usado na prática.</label>
                    <label class="choice-option"><input type="radio" name="answer" value="c">C) Ninguém fala de reciclagem.</label>
                    <label class="choice-option"><input type="radio" name="answer" value="d">D) Cascão toma banho demorado.</label>
                </div>
                <div class="answer-row"><button class="choice-submit" type="submit">Enviar ↗</button></div>
                <p class="feedback" aria-live="polite"></p>
            </form>
        </section>
    </main>

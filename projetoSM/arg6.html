<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080809">
    <title>ARG 06 | Questão 1</title>
    <link rel="stylesheet" href="css/arg.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <main class="riddle-shell" data-riddle="6">
        <div class="riddle-topline"><span>ARQUIVO 06 / 13</span><span>ACESSO RESTRITO</span></div>
        <section class="riddle-content">
            <p class="riddle-prompt">A escolha de Cascão para falar sobre economia de água produz qual efeito no texto?</p>
            <form class="answer-form">
                <div class="choice-list">
                    <label class="choice-option"><input type="radio" name="answer" value="a">A) Reforça que quem evita água não deve opinar sobre o tema.</label>
                    <label class="choice-option"><input type="radio" name="answer" value="b">B) Gera humor e mostra que a mudança de hábito pode alcançar até quem resiste.</label>
                    <label class="choice-option"><input type="radio" name="answer" value="c">C) Indica que ele é o único responsável pelo desperdício.</label>
                    <label class="choice-option"><input type="radio" name="answer" value="d">D) Prova que o tema água não é relevante para a turma.</label>
                </div>
                <div class="answer-row"><button class="choice-submit" type="submit">Enviar ↗</button></div>
                <p class="feedback" aria-live="polite"></p>
            </form>
        </section>
    </main>
</body>
</html>

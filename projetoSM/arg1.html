<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080809">
    <title>ARG 01</title>
    <link rel="stylesheet" href="css/arg.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <main class="riddle-shell" data-riddle="1">

        <div class="riddle-topline"><span>ARQUIVO 02 / 05 </span><span>ACESSO RESTRITO</span></div>

        <section class="riddle-content">

            <img class="puzzle-image" src="images/bdImage.png" alt="Imagem de um banco formado por pequenos símbolos de banco de dados">
            <p class="riddle-prompt"> O que essa imagem representa? </p>
            <form class="answer-form">
                <div class="answer-row"><input id="answer" name="answer" type="text" autocomplete="off" spellcheck="false" required><button type="submit">Enviar ↗</button></div>
                <p class="feedback" aria-live="polite"></p>
            </form>

            <p class="input-instruction">Digite minusculo e sem acento</p>
            
        </section>
    </main>
</body>
</html>

<!DOCTYPE html>

<head>

<body>
    <main class="riddle-shell" data-riddle="8">
        <div class="riddle-topline"><span>ARQUIVO 08 / 13</span><span>ACESSO RESTRITO</span></div>
        <section class="riddle-content">
            <p class="riddle-prompt">O fato de Franjinha criar o aplicativo e Mônica assumir a divulgação sugere que:</p>
            <form class="answer-form">
                <div class="choice-list">
                    <label class="choice-option"><input type="radio" name="answer" value="a">A) A tecnologia só funciona sem divulgação.</label>
                    <label class="choice-option"><input type="radio" name="answer" value="b">B) A solução técnica precisa de mediação com a comunidade.</label>
                    <label class="choice-option"><input type="radio" name="answer" value="c">C) Mônica é especialista em programação.</label>
                    <label class="choice-option"><input type="radio" name="answer" value="d">D) Franjinha não quer participar do projeto.</label>
                </div>
                <div class="answer-row"><button class="choice-submit" type="submit">Enviar ↗</button></div>
                <p class="feedback" aria-live="polite"></p>
            </form>
        </section>
    </main>

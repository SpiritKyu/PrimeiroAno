<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Formulario </title>
</head>
<body>
    <h1> Cadastro de Veículo </h1>
    <form>
        <div>
            <div>
                <label for=""> Nome do Proprietario: </label>
            </div>
                <input type="text">
        </div>
        <div>
            <div>
                <label for=""> Email: </label>
            </div>
                <input type="email">
        </div>
        <div>
            <div>
                <label for=""> Telefone: </label>
            </div>
                <input type="text">
        </div>
        <div>
            <div>
                <label for=""> Data de Nascimento: </label>
            </div>
                <input type="date">
        </div>
        <div>
            <div>
                <label for=""> Modelo do Veículo: </label>
            </div>
                <select name="" id="">
                    <option> Audi A1 </option>
                    <option> Peugeot 2008</option>
                    <option> Volkswagen Polo </option>
                    <option> Hyundai Bayon </option>
                    <option> Dacia Bigster</option>
                    <option> Dacia Sandero </option>
                    <option> Renault Kwid Zen 1.0 </option>
                    <option> Fiat Mobi Like 1.0 </option>
                    <option> Chevrolet Onix 1.0 </option>
                    <option> Hyundai i10 </option>
                </select>
        </div>
        <div>
            <div>
                <label for=""> Fabricante </label>
            </div>
                <select name="" id="">
                    <option> Audi </option>
                    <option> Peugeot </option>
                    <option> Volkswagen </option>
                    <option> Hyundai </option>
                    <option> Dacia </option>
                    <option> Renault </option>
                    <option> Fiat </option>
                    <option> Chevrolet </option>
                </select>
        </div>
        <div>
            <div>
                <label for=""> Combustível: </label>
            </div>
            <div>
                <input type="radio" name="rbcomb"> <span> Gasolina </span>
            </div>
            <div>
                <input type="radio" name="rbcomb"> <span> Álcool </span>
            </div>
            <div>
                <input type="radio" name="rbcomb"> <span> Diesel </span>
            </div>
            <div>
                <input type="radio" name="rbcomb"> <span> Elétrico </span>
            </div>
            <div>
                <input type="radio" name="rbcomb"> <span> Hibrido/Flex </span>
            </div>
        </div>
        <div>
            <div>
                <label for=""> Utilidade do Veículo: </label>
            </div>
            <div>
                <input type="checkbox" name=""> <span> Passeio </span>
            </div>
            <div>
                <input type="checkbox" name=""> <span> Trabalho </span>
            </div>
        </div>
        <div>
            <div>
                <input type="submit" value="Enviar">
            </div>
        </div>
</html>
